name: Godot Android Export

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  EXPORT_NAME: ledger_of_ash_and_iron

jobs:
  build_android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.1 build-tools;34.0.0 platforms;android-35 platforms;android-34 cmake;3.10.2.4988404 ndk;28.1.13356709'

      - name: Install Godot and export templates
        run: |
          set -e
          GODOT_VERSION=""
          for V in 4.7-stable 4.6.1-stable 4.6-stable; do
            if curl -fsIL "https://github.com/godotengine/godot/releases/download/${V}/Godot_v${V}_linux.x86_64.zip" > /dev/null; then
              GODOT_VERSION="$V"
              break
            fi
          done
          if [ -z "$GODOT_VERSION" ]; then echo "No Godot release found"; exit 1; fi
          echo "Using Godot $GODOT_VERSION"
          mkdir -p "$HOME/godot-bin"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-extract
          mv "/tmp/godot-extract/Godot_v${GODOT_VERSION}_linux.x86_64" "$HOME/godot-bin/godot"
          chmod +x "$HOME/godot-bin/godot"
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -O /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          TDIR="$HOME/.local/share/godot/export_templates/$(echo "$GODOT_VERSION" | sed 's/-/./')"
          mkdir -p "$TDIR"
          mv /tmp/templates/templates/* "$TDIR/"
          echo "GODOT_VERSION=$GODOT_VERSION" >> "$GITHUB_ENV"

      - name: Create debug keystore and Godot editor settings
        run: |
          set -e
          mkdir -p "$HOME/.android"
          keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          for F in editor_settings-4.tres editor_settings-4.7.tres editor_settings-4.6.tres; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo ''
              echo '[resource]'
              echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
              echo "export/android/java_sdk_path = \"$JAVA_HOME\""
              echo "export/android/debug_keystore = \"$HOME/.android/debug.keystore\""
              echo 'export/android/debug_keystore_user = "androiddebugkey"'
              echo 'export/android/debug_keystore_pass = "android"'
            } > "$HOME/.config/godot/$F"
          done

      - name: Import project resources
        continue-on-error: true
        run: godot --headless --path . --import

      - name: Check every GDScript file parses (non-blocking, read the log)
        continue-on-error: true
        run: |
          FAIL=0
          for f in $(find scripts -name '*.gd' | sort); do
            if ! OUT=$(godot --headless --path . --check-only --script "res://$f" 2>&1); then
              echo "::error file=$f::GDScript parse/check failed"
              echo "$OUT"
              FAIL=1
            else
              echo "OK $f"
            fi
          done
          exit $FAIL

      - name: Smoke test - load the main and dialogue scenes headless
        continue-on-error: true
        run: |
          cat > /tmp/smoke.gd <<'EOF'
          extends SceneTree
          func _init() -> void:
          	for p in ["res://scenes/main.tscn", "res://scenes/dialogue_stage.tscn", "res://scenes/studio_inspector.tscn"]:
          		var ps = load(p)
          		print("LOAD ", p, " -> ", ps != null)
          	quit()
          EOF
          mkdir -p scripts_tmp && sed 's/^          //' /tmp/smoke.gd > scripts_tmp/smoke.gd
          godot --headless --path . --script res://scripts_tmp/smoke.gd 2>&1 | tail -40 || true
          rm -rf scripts_tmp

      - name: Validate chapter JSON (non-blocking)
        continue-on-error: true
        run: godot --headless --path . --script res://scripts/validate_chapters.gd

      - name: Export Android debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/../../../.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -e
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" "build/android/${EXPORT_NAME}.apk"
          ls -lh build/android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: build/android/*.apk
