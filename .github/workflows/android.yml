name: Godot 4.7 CI & Android Export

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7-stable"
  EXPORT_NAME: "ledger_of_ash_and_iron"

jobs:
  validate_and_export_android:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Godot 4.7 Headless & Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION//.//-}/
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}_export_templates.tpz -d /tmp/templates
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/$(echo ${GODOT_VERSION} | tr '-' '.')"
          mkdir -p "$TEMPLATES_DIR"
          mv /tmp/templates/templates/* "$TEMPLATES_DIR/"

      - name: Validate Chapter JSON Graphs (Headless)
        run: |
          godot --headless --path . --script res://scripts/validate_chapters.gd

      - name: Verify GDScript Parse & Headless Project Load
        run: |
          godot --headless --path . --quit

      - name: Create Debug Keystore for Android Signing
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Export Android Debug APK
        run: |
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/${EXPORT_NAME}.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/android/${EXPORT_NAME}.apk
